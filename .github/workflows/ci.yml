# Runs the tests on every change, and tries the GitHub Action on the sample site.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test

  portal:
    name: Portal tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run types
      - run: npm run typecheck
      - run: npm test

  action:
    name: Try the GitHub Action on the sample site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan the sample site
        id: scan
        uses: ./
        with:
          url: test/fixtures/site/index.html
          report-name: sample-site-report
      - name: Check the scan found the planted problems
        env:
          PROBLEMS: ${{ steps.scan.outputs.problems }}
          PAGES: ${{ steps.scan.outputs.pages }}
        run: |
          echo "Found $PROBLEMS kind(s) of problem on $PAGES page(s)."
          test "$PAGES" -eq 3
          test "$PROBLEMS" -ge 5
